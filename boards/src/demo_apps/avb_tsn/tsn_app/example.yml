tsn_app:
  section-type: application
  contents:
    meta_path: ../GenAVB_TSN-rtos-apps/boards/src/demo_apps/avb_tsn/tsn_app
    project-root-path: boards/${board}/demo_apps/avb_tsn/tsn_app/${multicore_foldername}
    document:
      name: tsn_app${core_id_suffix_name}
      category: demo_apps
      brief: tsn_app
    toolchains:
      - -armgcc@debug
      - -armgcc@flexspi_nor_debug
      - -armgcc@flexspi_nor_release
      - -armgcc@sdram_debug
      - -armgcc@sdram_release
      - -iar@debug
      - -iar@release
      - -iar@flexspi_nor_debug
      - -iar@flexspi_nor_release
      - -iar@sdram_debug
      - -iar@sdram_release
      - -mdk@debug
      - -mdk@release
      - -mdk@flexspi_nor_debug
      - -mdk@flexspi_nor_release
      - -mdk@sdram_debug
      - -mdk@sdram_release
  boards:
    evkmimxrt1180@cm33:
    - +armgcc@release
    - -armgcc@debug
    - +armgcc@ram_release
    - -armgcc@ram_debug
    - -armgcc@hyperram_release
    - -armgcc@hyperram_debug
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@hyperram_txt_debug
    - -armgcc@hyperram_txt_release
    evkmimxrt1180@cm7:
    - +armgcc@release
    - -armgcc@debug
    - +armgcc@ram_release
    - -armgcc@ram_debug
    - -armgcc@hyperram_release
    - -armgcc@hyperram_debug
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    evkbmimxrt1170@cm7:
    - +armgcc@release
    - -armgcc@debug
    - +armgcc@ram_release
    - -armgcc@ram_debug
    - +armgcc@sdram_release
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@sdram_debug
    frdmmcxe31b:
    - +armgcc@release
    - -armgcc@debug
    frdmmcxe247:
    - +armgcc@release
    - -armgcc@debug
    frdmimxrt1186@cm33:
    - +armgcc@release
    - -armgcc@debug
    - +armgcc@ram_release
    - -armgcc@ram_debug
    - +armgcc@hyperram_release
    - -armgcc@hyperram_debug
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@hyperram_txt_debug
    - -armgcc@hyperram_txt_release
    frdmimxrt1186@cm7:
    - +armgcc@release
    - -armgcc@debug
    - +armgcc@ram_release
    - -armgcc@ram_debug
    - -armgcc@hyperram_release
    - -armgcc@hyperram_debug
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release

tsn_app@rt1180_cm33_hyperram_config:
  section-type: custom_application
  contents:
    toolchains:
      - -armgcc@release
      - -armgcc@ram_release
      - -armgcc@hyperram_debug
      - -armgcc@debug
      - -armgcc@ram_debug
      - -armgcc@flexspi_nor_debug
      - -armgcc@flexspi_nor_release
      - -armgcc@hyperram_txt_debug
      - -armgcc@hyperram_txt_release
      - -iar@debug
      - -iar@release
      - -iar@flexspi_nor_debug
      - -iar@flexspi_nor_release
      - -iar@hyperram_debug
      - -iar@hyperram_release
      - -mdk@debug
      - -mdk@release
      - -mdk@flexspi_nor_debug
      - -mdk@flexspi_nor_release
      - -mdk@hyperram_debug
      - -mdk@hyperram_release
    document:
      extra_build_args:
      - -DCONFIG_MCUX_COMPONENT_component.ele_crypto=y
      - -DCONFIG_MCUX_COMPONENT_component.psa_crypto_driver.ele_s4xx_rng=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.x509=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.crypto=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.ssl.no_psa=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.crypto.no_psa=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=y
      - -DCONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.psa_crypto_config=n
  boards:
    evkmimxrt1180@cm33:
    - +armgcc@hyperram_release

